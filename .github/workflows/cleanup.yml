name: cleanup
on:
  push:
    tags:
      - 'cleanup-26x-2'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: remove grouped release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: FeedMoth/realistic-tree-physics
        run: |
          gh release list
          gh release delete v1.1.0-26.x -y --cleanup-tag
          echo "delete exit: $?"
          gh release list || true
