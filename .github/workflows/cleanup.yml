name: cleanup
on:
  push:
    tags:
      - 'cleanup-1211y'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: remove 1.21 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: FeedMoth/realistic-tree-physics
        run: gh release delete v1.1.0-1.21.x -y --cleanup-tag || true
