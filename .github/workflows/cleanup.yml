name: cleanup
on:
  push:
    tags:
      - 'cleanup-26x'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: remove grouped release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.1.0-26.x -y --cleanup-tag || true
