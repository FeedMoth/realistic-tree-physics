name: cleanup
on:
  push:
    tags:
      - 'cleanup-1211'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: remove debug release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: FeedMoth/realistic-tree-physics
        run: |
          gh release delete debug-1211 -y --cleanup-tag || true
          gh release list || true
